[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "meltygui"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3.12"]
description = "Immediate-mode Python UI, live inspection, HDR and tensor visualization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "meltygui-imgui[glfw]==2.0.0.post1", "glfw>=2.10", "PyOpenGL>=3.1.7", "PyOpenGL-accelerate>=3.1.7",
    "numpy>=1.26", "libcst>=1.4", "jedi>=0.19", "Pygments>=2.18", "freetype-py>=2.4",
    "watchdog>=4", "pillow>=10", "rtree>=1.2", "packaging>=24", "tomlkit>=0.13",
    "httpx>=0.27", "anthropic>=0.40", "pyte>=0.8", "psutil>=6", "rich>=13",
    "symspellpy>=6.7", "mcp>=1.0", "uvicorn>=0.30",
]

[project.optional-dependencies]
tensor = ["torch>=2.2", "meltygui-pycuda==2026.1.post1"]
input = ["evdev>=1.7; sys_platform == 'linux'", "pynput>=1.7"]
profile = ["line-profiler>=4"]

[dependency-groups]
dev = ["pytest>=8", "build>=1.2", "PyGLM>=2.8"]

[tool.hatch.build.targets.wheel]
packages = ["meltygui"]

[tool.hatch.build.targets.sdist]
include = ["/meltygui", "/tests", "/examples", "/tools/native_wheels", "/tools/release.py", "/README.md", "/LICENSE", "/docs/APPS.md", "/docs/DEVELOPMENT.md", "/docs/SUPPORT_WHEELS.md", "/docs/PUBLISHING.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
