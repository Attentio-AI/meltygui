name: Build and publish
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to PyPI
        type: boolean
        default: false
      expected_version:
        description: Package version confirmed by the release UI
        type: string
        default: ''
      expected_sha:
        description: Pushed source commit confirmed by the release UI
        type: string
        default: ''
      imgui_run_id:
        description: Verified ImGui build to test before publishing (optional)
        type: string
        default: ''
      pycuda_run_id:
        description: Verified PyCUDA build to test before publishing (optional)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - name: Check confirmed release version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          actual_version=$(uv run --no-project --python 3.12 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$actual_version" ]; then
            echo "Confirmed $EXPECTED_VERSION but source states $actual_version"
            exit 1
          fi
      - run: uv build --no-sources
      # meltygui-imgui and meltygui-pycuda publish from their own repositories.
      # The runner's own python is 3.10; the release tool needs tomllib (3.11+).
      - run: uv run --no-project --python 3.12 tools/release.py collect --core-only --require-license
      - name: Check package metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/release/*.whl dist/release/*.tar.gz
      # Downloading artifacts across repositories needs another credential. Public
      # source checkouts do not: rebuild only the unpublished, already-tested commits.
      - name: Resolve verified support commits
        id: support
        if: (inputs.imgui_run_id != '' || inputs.pycuda_run_id != '') && !inputs.publish
        env:
          IMGUI_RUN_ID: ${{ inputs.imgui_run_id }}
          PYCUDA_RUN_ID: ${{ inputs.pycuda_run_id }}
        run: |
          python - <<'PYTHON'
          import json, os, re, urllib.request
          for kind in ('imgui', 'pycuda'):
              run_id = os.environ[kind.upper() + '_RUN_ID']
              if not run_id:
                  continue
              if not run_id.isdecimal():
                  raise SystemExit('Invalid support build ID')
              repository = 'Attentio-AI/meltygui-' + kind
              request = urllib.request.Request(f'https://api.github.com/repos/{repository}/actions/runs/{run_id}', headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'meltygui-release'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              sha = run.get('head_sha', '')
              if (run.get('status') != 'completed' or run.get('conclusion') != 'success'
                      or run.get('head_repository', {}).get('full_name', '').lower() != repository.lower()
                      or not re.fullmatch(r'[0-9a-f]{40}', sha)):
                  raise SystemExit('Support build is not a successful release-source build')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'{kind}_sha={sha}\n')
          PYTHON
      - uses: actions/checkout@v4
        if: steps.support.outputs.imgui_sha != ''
        with:
          repository: Attentio-AI/meltygui-imgui
          ref: ${{ steps.support.outputs.imgui_sha }}
          path: .release-sources/imgui
          persist-credentials: false
      - name: Build staged ImGui wheels
        if: steps.support.outputs.imgui_sha != ''
        run: python .release-sources/imgui/tools/build.py --output "$GITHUB_WORKSPACE/dist/support/imgui"
      - uses: actions/checkout@v4
        if: steps.support.outputs.pycuda_sha != ''
        with:
          repository: Attentio-AI/meltygui-pycuda
          ref: ${{ steps.support.outputs.pycuda_sha }}
          path: .release-sources/pycuda
          persist-credentials: false
      - name: Extract pinned CUDA toolkit for staged PyCUDA
        if: steps.support.outputs.pycuda_sha != ''
        run: |
          image=nvidia/cuda@sha256:327c9e046fbf662275be0934742f7e5412f9b24402ee90bf4d649c1a21707912
          container=$(docker create "$image")
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/local/cuda-12.1" "$RUNNER_TEMP/cuda-12.1"
      - name: Build staged PyCUDA wheels
        if: steps.support.outputs.pycuda_sha != ''
        run: python .release-sources/pycuda/tools/build.py --cuda-root "$RUNNER_TEMP/cuda-12.1" --output "$GITHUB_WORKSPACE/dist/support/pycuda"
      - name: Install the wheel with published or staged support wheels
        run: |
          mkdir -p dist/support/imgui dist/support/pycuda
          for version in 3.11 3.12 3.13; do
            uv venv "$RUNNER_TEMP/meltygui-check-$version" --python "$version"
            support=()
            for directory in dist/support/imgui dist/support/pycuda; do
              if compgen -G "$directory/*.whl" >/dev/null; then
                wheels=("$directory"/*-cp${version/./}-*.whl)
                test -f "${wheels[0]}"
                support+=("${wheels[@]}")
              fi
            done
            uv pip install --python "$RUNNER_TEMP/meltygui-check-$version/bin/python" --only-binary :all: dist/release/meltygui-*.whl "${support[@]}" pytest
            "$RUNNER_TEMP/meltygui-check-$version/bin/python" -I -m pytest tests/test_package_contract.py tests/test_public_boundary.py tests/test_core_syntax.py -q
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/SHA256.json
  publish:
    if: inputs.publish && vars.MELTYGUI_PUBLISH_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - name: Publish MeltyGUI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/release/meltygui-*.whl dist/release/meltygui-*.tar.gz
