name: Build and publish
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to PyPI
        type: boolean
        default: false
      expected_version:
        description: Package version confirmed by the release UI
        type: string
        default: ''
      expected_sha:
        description: Pushed source commit confirmed by the release UI
        type: string
        default: ''
      imgui_run_id:
        description: Verified ImGui build to test before publishing (optional)
        type: string
        default: ''
      pycuda_run_id:
        description: Verified PyCUDA build to test before publishing (optional)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - name: Check confirmed release version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          actual_version=$(uv run --no-project --python 3.12 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$actual_version" ]; then
            echo "Confirmed $EXPECTED_VERSION but source states $actual_version"
            exit 1
          fi
      - run: uv build --no-sources
      # meltygui-imgui and meltygui-pycuda publish from their own repositories.
      # The runner's own python is 3.10; the release tool needs tomllib (3.11+).
      - run: uv run --no-project --python 3.12 tools/release.py collect --core-only --require-license
      - name: Check package metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/release/*.whl dist/release/*.tar.gz
      - uses: actions/download-artifact@v4
        if: inputs.imgui_run_id != '' && !inputs.publish
        with:
          name: release
          repository: Attentio-AI/meltygui-imgui
          run-id: ${{ inputs.imgui_run_id }}
          github-token: ${{ github.token }}
          path: dist/support/imgui
      - uses: actions/download-artifact@v4
        if: inputs.pycuda_run_id != '' && !inputs.publish
        with:
          name: release
          repository: Attentio-AI/meltygui-pycuda
          run-id: ${{ inputs.pycuda_run_id }}
          github-token: ${{ github.token }}
          path: dist/support/pycuda
      - name: Install the wheel with published or staged support wheels
        run: |
          mkdir -p dist/support/imgui dist/support/pycuda
          for version in 3.11 3.12 3.13; do
            uv venv "$RUNNER_TEMP/meltygui-check-$version" --python "$version"
            support=()
            for directory in dist/support/imgui dist/support/pycuda; do
              if compgen -G "$directory/*.whl" >/dev/null; then
                wheels=("$directory"/*-cp${version/./}-*.whl)
                test -f "${wheels[0]}"
                support+=("${wheels[@]}")
              fi
            done
            uv pip install --python "$RUNNER_TEMP/meltygui-check-$version/bin/python" --only-binary :all: dist/release/meltygui-*.whl "${support[@]}" pytest
            "$RUNNER_TEMP/meltygui-check-$version/bin/python" -I -m pytest tests/test_package_contract.py tests/test_public_boundary.py tests/test_core_syntax.py -q
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/SHA256.json
  publish:
    if: inputs.publish && vars.MELTYGUI_PUBLISH_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - name: Publish MeltyGUI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/release/meltygui-*.whl dist/release/meltygui-*.tar.gz
