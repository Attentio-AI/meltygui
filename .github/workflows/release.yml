name: Build and publish
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to PyPI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - run: uv build --no-sources
      # meltygui-imgui and meltygui-pycuda publish from their own repositories.
      - run: python tools/release.py collect --core-only --require-license
      - name: Check package metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/release/*.whl dist/release/*.tar.gz
      - name: Install exactly as a user does, with the support wheels from PyPI
        run: |
          for version in 3.11 3.12 3.13; do
            uv venv "$RUNNER_TEMP/meltygui-check-$version" --python "$version"
            uv pip install --python "$RUNNER_TEMP/meltygui-check-$version/bin/python" --only-binary :all: dist/release/meltygui-*.whl pytest
            "$RUNNER_TEMP/meltygui-check-$version/bin/python" -I -m pytest tests/test_package_contract.py tests/test_public_boundary.py tests/test_core_syntax.py -q
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/SHA256.json
  publish:
    if: inputs.publish && vars.MELTYGUI_PUBLISH_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - name: Publish MeltyGUI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/release/meltygui-*.whl dist/release/meltygui-*.tar.gz
